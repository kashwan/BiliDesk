name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example mpv-core-test-1)'
        required: true
        type: string
      ref:
        description: 'Source ref to build'
        required: true
        default: 'restructure-mpv-core'
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innoSetup --no-progress -y

      - name: Download pinned libmpv
        run: |
          New-Item -ItemType Directory -Force -Path libmpv\win-x64 | Out-Null
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z" -OutFile "$env:RUNNER_TEMP\mpv-dev.7z"
          $expected = "88504EE5560942A955405E99DFB5971368E4CF851321F36565BF2A667271DB1B"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\mpv-dev.7z" -Algorithm SHA256).Hash
          if ($actual -ne "273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452") {
            throw "mpv archive hash mismatch: $actual"
          }
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" -o"$env:RUNNER_TEMP\mpv-dev" libmpv-2.dll -y | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mpv-dev\libmpv-2.dll" libmpv\win-x64\libmpv-2.dll
          $dllHash = (Get-FileHash libmpv\win-x64\libmpv-2.dll -Algorithm SHA256).Hash
          if ($dllHash -ne $expected) { throw "libmpv-2.dll hash mismatch: $dllHash" }

      - name: Build and verify
        run: |
          dotnet build BiliDesk.sln -c Release
          dotnet test BiliDesk.Tests/BiliDesk.Tests.csproj -c Release --no-build

      - name: Publish
        run: powershell -ExecutionPolicy Bypass -File 发布.ps1

      - name: Compile installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=1.8.6 Publish\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          powershell -ExecutionPolicy Bypass -File 发布.ps1 -FixIntegrity

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliDesk-mpv-core-${{ inputs.tag }}
          path: |
            Publish/BiliDesk-*-portable.zip
            Publish/BiliDesk-*-setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: mpv core test ${{ inputs.tag }}
          prerelease: true
          files: |
            Publish/BiliDesk-*-portable.zip
            Publish/BiliDesk-*-setup.exe
