name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example mpv-core-test-1)'
        required: true
        type: string
      ref:
        description: 'Source ref to build'
        required: true
        default: 'restructure-mpv-core'
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innoSetup --no-progress -y

      - name: Download latest libmpv v3
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "BiliDesk-release" } `
            -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object {
            $_.name -match '^mpv-dev-x86_64-v3-.*\.7z$' -and $_.digest -match '^sha256:'
          } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev x86-64-v3 asset with digest in latest release" }
          $expectedArchive = $asset.digest.Substring(7)
          Write-Host "Using $($asset.name) ($expectedArchive)"
          New-Item -ItemType Directory -Force -Path libmpv\win-x64 | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\mpv-dev.7z"
          $actualArchive = (Get-FileHash "$env:RUNNER_TEMP\mpv-dev.7z" -Algorithm SHA256).Hash
          if ($actualArchive -ne $expectedArchive) { throw "mpv archive hash mismatch: $actualArchive" }
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" -o"$env:RUNNER_TEMP\mpv-dev" libmpv-2.dll -y | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mpv-dev\libmpv-2.dll" libmpv\win-x64\libmpv-2.dll
          $dllHash = (Get-FileHash libmpv\win-x64\libmpv-2.dll -Algorithm SHA256).Hash
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "发布.ps1"
          $bytes = [System.IO.File]::ReadAllBytes($scriptPath)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $text = [regex]::Replace($text, '(\$LibMpvSha256 = ")[0-9A-Fa-f]{64}(")', "`${1}$dllHash`${2}")
          [System.IO.File]::WriteAllBytes($scriptPath, [System.Text.Encoding]::UTF8.GetBytes($text))

      - name: Build and verify
        run: |
          dotnet build BiliDesk.sln -c Release
          dotnet test BiliDesk.Tests/BiliDesk.Tests.csproj -c Release --no-build

      - name: Publish
        run: powershell -ExecutionPolicy Bypass -File 发布.ps1

      - name: Compile installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=1.8.9 Publish\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          powershell -ExecutionPolicy Bypass -File 发布.ps1 -FixIntegrity

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiliDesk-mpv-core-${{ inputs.tag }}
          path: |
            Publish/BiliDesk-*-portable.zip
            Publish/BiliDesk-*-setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: BiliDesk ${{ inputs.tag }} · mpv-only 独立发行线
          prerelease: false
          body: |
            这不是上游 `ABING1111/BiliDesk` 的官方发布，而是 `kashwan/BiliDesk` 的 `restructure-mpv-core` 独立发行线。

            - 播放内核：libmpv，已移除 VLC；使用 shinchiro x86-64-v3 / AVX2 构建，需要 CPU 支持 AVX2。
            - 合入上游 1.8.8 之后的评论、播放器、下载、搜索、私信、诊断等更新，并按 mpv 分支完成兼容适配。
            - 修复评论输入框展开/收起箭头方向、收起评论框箭头方向、全屏按钮箭头、字幕空白选项。
            - 修复全屏/最大化/还原时播放器控件与弹幕覆盖层延迟跟随，减少弹幕逐帧重复布局。
            - 新增删除评论、直播发送弹幕、快捷键自定义、崩溃转储/界面冻结诊断、DASH 选中清晰度下载与 MP4 章节读写。
            - 默认关闭自动更新；如需更新请到本项目 Releases 页手动检查。
            - 源码与说明：https://github.com/kashwan/BiliDesk/tree/restructure-mpv-core
          files: |
            Publish/BiliDesk-*-portable.zip
            Publish/BiliDesk-*-setup.exe
