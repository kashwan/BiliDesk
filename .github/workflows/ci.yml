name: ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: |
          dotnet build BiliDesk.sln -c Release
          dotnet test BiliDesk.Tests/BiliDesk.Tests.csproj -c Release --no-build
